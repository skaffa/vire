plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Keep the dev game small enough for 8 GB machines.
			vmArgs "-Xms256M", "-Xmx2G"
			// ./gradlew runClient -Ppacketlog: log every outgoing packet class while Vire Mode is active (PLAN.md §4.3)
			if (project.hasProperty("packetlog")) {
				property "vire.packetlog", "true"
			}
			// ./gradlew runClient -Pselftest=run|quit: scripted M1 acceptance test (see dev.vire.client.dev.SelfTest)
			if (project.hasProperty("selftest")) {
				property "vire.selftest", project.property("selftest").toString()
			}
		}
		server {
			// Separate folder so the test server does not share worlds or configs with the client.
			runDir "run-server"
			vmArgs "-Xms256M", "-Xmx1G"
		}
	}

	mods {
		"vire" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: "Configure" button in Mod Menu. Not bundled; also loaded in the dev client.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Optional: Litematica auto-load (PLAN.md §10.2). Jars from Modrinth in libs/ (not in git, not bundled):
	// litematica-fabric-26.3-0.29.1, malilib-fabric-26.3-0.30.2, litematica-printer-26.3-3.2.3.
	// Compiled against when present; in the dev client only with -Plitematica.
	def litematicaJars = fileTree(dir: "libs", include: ["litematica-fabric-*.jar", "malilib-fabric-*.jar"])
	clientCompileOnly litematicaJars
	if (project.hasProperty("litematica")) {
		localRuntime fileTree(dir: "libs", include: ["*.jar"])
	}

	// Core (src/main) never imports Minecraft classes, so it is tested with plain JUnit.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
	// Minecraft's logger writes logs/ into the working directory; keep it out of the project root
	def testDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testDir
	doFirst { testDir.mkdirs() }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
