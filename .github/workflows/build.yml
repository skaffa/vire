# Builds the mod on every push.
# - push to main: replaces the jar in the "dev" pre-release (always the newest build)
# - push of a tag v*: creates a release with the jar
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Vire's optional Litematica hook compiles against Litematica and MaLiLib (not bundled, not in git).
      - name: Fetch Litematica and MaLiLib (compile only)
        run: |
          mkdir -p libs
          curl -sSfL -A "vire-ci" -o libs/litematica-fabric-26.3-0.29.1.jar https://cdn.modrinth.com/data/bEpr0Arc/versions/ZqV316KY/litematica-fabric-26.3-0.29.1.jar
          curl -sSfL -A "vire-ci" -o libs/malilib-fabric-26.3-0.30.2.jar https://cdn.modrinth.com/data/GcWjdA9I/versions/JX9bESec/malilib-fabric-26.3-0.30.2.jar
          echo "45a8d468463afb97b3fc72efa168024ad69e670e77f5455ecf588583434a1787b32795edf5236579c32c828b02873efb39a4808caa08bbbaf1d8b6b090b160c3  libs/litematica-fabric-26.3-0.29.1.jar" | sha512sum -c -
          echo "8f17a5d70cb2f461aeb540f4a99de01c3351f8d3678d902d3d00cfe5d10c039fdc111c1079fe23aacb7936b793ad1cd045a8dc3a9e7926865820c254d92345b8  libs/malilib-fabric-26.3-0.30.2.jar" | sha512sum -c -

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Find the jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR" .jar)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: build/libs/*.jar

      - name: Dev pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          DEV="build/libs/${{ steps.jar.outputs.name }}-dev.$SHORT.jar"
          cp "${{ steps.jar.outputs.path }}" "$DEV"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$DEV" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ($SHORT)" \
            --notes "Automatic build of the latest commit on main ($SHORT). Not a tested release; use the Modrinth or tagged releases for normal play."

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "$GITHUB_REF_NAME" --generate-notes
